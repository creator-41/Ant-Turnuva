<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Bağlantı Yok | ANT Fantezi Lig</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#0f172a;color:#f8fafc;font-family:'Segoe UI',Arial,sans-serif}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.wrap{width:min(100%,460px);text-align:center}
.logo{width:104px;height:104px;object-fit:contain;filter:drop-shadow(0 12px 26px rgba(0,0,0,.4));margin-bottom:20px}
.card{background:linear-gradient(145deg,#1e293b,#172033);border:1px solid #334155;border-radius:22px;padding:30px 24px;box-shadow:0 20px 50px rgba(0,0,0,.32)}
.code{font-size:54px;font-weight:900;color:#38bdf8;line-height:1;margin-bottom:10px}
h1{font-size:24px;margin:0 0 10px}
p{color:#94a3b8;font-size:14px;line-height:1.6;margin:0 0 22px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 20px;border-radius:12px;border:0;background:#38bdf8;color:#082f49;font-weight:900;text-decoration:none;cursor:pointer;font-size:14px}
.brand{margin-top:18px;color:#64748b;font-size:11px;font-weight:800;letter-spacing:1.5px}
</style>
</head>
<body>
<main class="wrap">
  <img class="logo" src="/logo.png" alt="ANT Fantezi Lig">
  <section class="card">
    <div class="code">📡</div>
    <h1>Bağlantı Yok</h1>
    <p>ANT Fantezi Lig'e şu anda ulaşılamıyor. İnternet bağlantını kontrol edip tekrar deneyebilirsin.</p>
    <button class="btn" type="button" onclick="retryConnection()">🔄 Tekrar Dene</button>
  </section>
  <div class="brand">ANT FANTEZİ LİG</div>
</main>

<script>
function retryConnection(){
  if (navigator.onLine) {
    window.location.replace('/?online=1');
    return;
  }
  const old = document.getElementById('offlineStatus');
  if (old) old.remove();
  const msg = document.createElement('div');
  msg.id = 'offlineStatus';
  msg.textContent = '📡 Bağlantı hâlâ yok. İnternet bağlantını kontrol et.';
  msg.style.cssText = 'margin-top:14px;color:#fbbf24;font-size:13px;font-weight:700;';
  document.querySelector('.card').appendChild(msg);
}
window.addEventListener('online', () => {
  const msg = document.getElementById('offlineStatus');
  if (msg) msg.textContent = '✅ İnternet bağlantısı geldi. Tekrar Dene’ye basabilirsin.';
});
</script>

</body>
</html>
