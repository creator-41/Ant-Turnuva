<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uygulamayı İndir</title>
    <style>
        body {
            background-color: #f3f4f6;
            color: #1f2937;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 12px 20px;
            margin-bottom: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-green {
            background-color: #10b981;
            color: white;
        }

        .btn-green:hover {
            background-color: #059669;
        }
        
        /* Üstte çıkan bilgilendirme menüsü (Top Banner) */
        .instruction-banner {
            position: fixed;
            top: -100%; /* Başlangıçta ekranın dışında */
            left: 0;
            width: 100%;
            background-color: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            padding: 25px 20px 20px;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            text-align: center;
            z-index: 1001;
            transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-sizing: border-box;
        }

        .instruction-banner.active {
            top: 0; /* Aktif olunca yukarıdan iner */
        }
        
        .banner-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.4);
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .banner-backdrop.active {
            opacity: 1;
            pointer-events: all;
        }

        .banner-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 10px;
            margin-top: 0;
        }

        .banner-text {
            color: #4b5563;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 15px;
        }
        
        .banner-text p {
            margin: 8px 0;
        }
        
        .close-btn {
            background-color: #e5e7eb;
            color: #374151;
            padding: 10px 20px;
            border-radius: 20px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            max-width: 200px;
            margin: 0 auto;
            margin-top: 10px;
        }

        /* YENİ: Işıltılı Hareketli Ok */
        .glowing-arrow {
            position: fixed;
            bottom: 30px; /* Safari'nin menüsüne yakın olacak şekilde */
            left: 50%;
            transform: translateX(-50%);
            font-size: 40px;
            z-index: 1002; /* Banner'ın ve backdrop'ın üstünde */
            opacity: 0;
            pointer-events: none; /* Tıklanmasını engelle */
            transition: opacity 0.3s ease;
            
            /* Işıltı (Glow) efekti */
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.8), 
                         0 0 20px rgba(59, 130, 246, 0.6), 
                         0 0 30px rgba(59, 130, 246, 0.4);
            color: white; 
            
            /* Sadece aşağı yukarı zıplama animasyonu */
            animation: bounceAndGlow 1.5s infinite ease-in-out;
        }
        
        .glowing-arrow.active {
            opacity: 1;
        }
        
        /* Zıplama ve ışıldama animasyonunun detayları */
        @keyframes bounceAndGlow {
            0%, 100% {
                bottom: 30px;
                text-shadow: 0 0 10px rgba(59, 130, 246, 0.8), 
                             0 0 20px rgba(59, 130, 246, 0.6);
            }
            50% {
                bottom: 10px; /* Aşağıya doğru zıplar */
                text-shadow: 0 0 20px rgba(59, 130, 246, 1), 
                             0 0 30px rgba(59, 130, 246, 0.8),
                             0 0 40px rgba(59, 130, 246, 0.6); /* Zıpladığında ışıltı artar */
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h2 style="margin-top: 0;">Uygulamayı İndir</h2>
        <p style="color: #6b7280; margin-bottom: 25px;">
            Web sitemizi bir uygulama gibi kullanmak için ana ekranınıza ekleyin.
        </p>

        <!-- Sadece Ana Ekrana Ekle Butonu Kaldı -->
        <button onclick="showInstructionBanner()" class="btn btn-green">
            📱 Ana Ekrana Ekle
        </button>
    </div>

    <!-- Karartma Arka Planı -->
    <div class="banner-backdrop" id="bannerBackdrop" onclick="hideInstructionBanner()"></div>

    <!-- Üstten İnen Bilgilendirme Menüsü -->
    <div class="instruction-banner" id="instructionBanner">
        <h3 class="banner-title">Ana Ekrana Nasıl Eklenir?</h3>
        <div class="banner-text">
            <p>1. Ekranın altındaki <strong>Paylaş</strong> ( 📤 ) butonuna dokunun.</p>
            <p>2. Açılan menüde aşağı kaydırıp <strong>"Ana Ekrana Ekle"</strong> seçeneğine tıklayın.</p>
        </div>
        <button class="close-btn" onclick="hideInstructionBanner()">Tamam, Anladım</button>
    </div>

    <!-- YENİ: Aşağı Işıltılı Ok -->
    <div class="glowing-arrow" id="glowingArrow">⬇️</div>

    <script>
        const banner = document.getElementById('instructionBanner');
        const backdrop = document.getElementById('bannerBackdrop');
        const arrow = document.getElementById('glowingArrow');

        function showInstructionBanner() {
            banner.classList.add('active');
            backdrop.classList.add('active');
            arrow.classList.add('active'); // Oku görünür yap
        }

        function hideInstructionBanner() {
            banner.classList.remove('active');
            backdrop.classList.remove('active');
            arrow.classList.remove('active'); // Oku gizle
        }
    </script>

</body>
</html>
